# Reporting Framework Solution Options - Presentation Data
# Edit this file to update presentation content, then regenerate slides

metadata:
  title: "Reporting Framework Solution Options - Technical Decision"
  audience: "Product, Delivery Manager, Tech Leads"
  date: "2024"
  total_slides: 10

slides:

  # ============================================================
  # Slide 1: Executive Summary
  # ============================================================
  - slide_number: 1
    title: "Executive Summary"
    sections:
      - type: text
        content: |
          **Business Problem:** Metadata-driven reporting framework for SQL Server stored procedures

          **Core Requirement:** Add new reports without modifying framework code

          **Solution Evaluated:** 3 implementation approaches

      - type: table
        headers: ["Metric", "Main (POJO)", "Dataset-impl", "Spark-SQL"]
        rows:
          - ["Framework Code", "~1,200 LOC", "~1,871 LOC", "~1,400 LOC (est.)"]
          - ["Java Files", "14 files", "20 files", "~16 files (est.)"]
          - ["Dependencies", "Jackson", "Jackson", "Spark-SQL (local)"]
          - ["JAR Size", "~8 MB", "~12 MB", "~25 MB"]
          - ["Test Coverage", "16 tests ✅", "32 tests ✅", "TBD"]

      - type: text
        content: "**Decision Needed:** Which approach for production deployment?"

  # ============================================================
  # Slide 2: Common Foundation
  # ============================================================
  - slide_number: 2
    title: "Common Foundation - What Doesn't Change"
    sections:
      - type: text
        content: "**All 3 approaches share the same core:**"

      - type: diagram
        content: |
          ┌─────────────────────────────────────────────────┐
          │  Metadata-Driven Configuration (JSON in DB)     │ ← Same for all
          ├─────────────────────────────────────────────────┤
          │  StoredProcedureExecutor (CallableStatement)    │ ← Same for all
          ├─────────────────────────────────────────────────┤
          │  GenericParameterBinder (Java ↔ SQL types)     │ ← Same for all
          ├─────────────────────────────────────────────────┤
          │  Connection Pooling (HikariCP compatible)       │ ← Same for all
          └─────────────────────────────────────────────────┘
                            ↓
                [ Only data mapping differs ]

      - type: bullets
        title: "Shared Capabilities"
        items:
          - "✅ Dynamic parameter binding"
          - "✅ Output parameters support"
          - "✅ Metadata caching (thread-safe)"
          - "✅ Spring Boot integration"
          - "✅ Zero framework changes to add reports"

      - type: text
        content: "**What differs:** How ResultSet data is mapped and transformed"

  # ============================================================
  # Slide 3: Option 1 - POJO Approach
  # ============================================================
  - slide_number: 3
    title: "Option 1 - POJO Approach (Main Branch)"
    sections:
      - type: subtitle
        content: "How It Works"

      - type: code
        language: java
        content: |
          // 1. Define POJO (compile-time type safety)
          public class EmployeeReport {
              private Integer employeeId;
              private String firstName;
              private BigDecimal salary;
              // getters/setters
          }

          // 2. Metadata with explicit mappings
          {
            "columnMappings": [
              {"column": "employee_id", "field": "employeeId", "required": true},
              {"column": "first_name", "field": "firstName", "required": true}
            ]
          }

          // 3. Execute with full type safety
          ReportResult<EmployeeReport> result = service.execute("report", params);
          List<EmployeeReport> employees = result.getResults(); // Fully typed!

          // 4. Transform using native Java Streams API
          List<EmployeeReport> highEarners = employees.stream()
              .filter(emp -> emp.getSalary().compareTo(valueOf(80000)) > 0)
              .sorted(Comparator.comparing(EmployeeReport::getSalary).reversed())
              .limit(10)
              .collect(Collectors.toList());

          double avgSalary = employees.stream()
              .mapToDouble(emp -> emp.getSalary().doubleValue())
              .average().orElse(0.0);

      - type: table
        title: "Key Metrics"
        headers: ["Metric", "Value"]
        rows:
          - ["Code per report", "40-60 lines (POJO + mappings)"]
          - ["Runtime dependencies", "3 (Jackson, SLF4J, JDBC)"]
          - ["Memory overhead", "~200 MB (base JVM)"]
          - ["Startup time", "<1 second"]
          - ["API learning curve", "✅ Zero (standard Java)"]

      - type: bullets
        title: "Strengths"
        items:
          - "✅ **Compile-time type safety** - Errors caught by compiler, not at runtime"
          - "✅ **IDE support** - Autocomplete, refactoring, navigation"
          - "✅ **Native Java Streams** - No custom API to learn, team already knows it"
          - "✅ **Minimal dependencies** - Only Jackson for JSON"
          - "✅ **Production proven** - Standard enterprise pattern"

      - type: bullets
        title: "Considerations"
        items:
          - "⚠️ **POJO maintenance** - Need to create/update Java class per report (~20-30 lines)"
          - "⚠️ **Metadata verbosity** - Explicit column mappings required (~5-10 lines per report)"
          - "⚠️ **Schema changes** - Require POJO updates and recompilation"

  # ============================================================
  # Slide 4: Option 2 - Dual Mode
  # ============================================================
  - slide_number: 4
    title: "Option 2 - Dual Mode (Dataset-impl Branch)"
    sections:
      - type: subtitle
        content: "How It Works"

      - type: code
        language: java
        content: |
          // NO POJO needed for dynamic mode!

          // Execute dynamically
          DataSet employees = service.executeDynamic("employees", params);

          // Transform with custom fluent DSL
          DataSet result = DataQuery.from(employees)
              .filter(row -> row.getBigDecimal("salary").compareTo(valueOf(80000)) > 0)
              .select("name", "salary", "hire_date")
              .orderBy("salary").desc()
              .limit(10)
              .execute();

          // Type-safe accessors (no casting)
          for (DataRow row : result.getRows()) {
              String name = row.getString("name");              // Type-safe
              BigDecimal salary = row.getBigDecimal("salary");  // No casting
              LocalDate hireDate = row.getLocalDate("hire_date");
          }

          // Complex operations built-in
          DataSet joined = DataOperations.innerJoin(
              employees, departments, "department_id");

          DataSet summary = DataQuery.from(employees)
              .groupBy("dept_id").avg("salary").count("*").execute();

      - type: table
        title: "Key Metrics"
        headers: ["Metric", "Value"]
        rows:
          - ["Code per report", "10-15 lines (dynamic mode)"]
          - ["Runtime dependencies", "3 (Jackson, SLF4J, JDBC)"]
          - ["Memory overhead", "~220 MB (base JVM + DataSet)"]
          - ["Startup time", "<1 second"]
          - ["API learning curve", "⚠️ Medium (4 new classes)"]

      - type: bullets
        title: "Custom API Components"
        items:
          - "`DataRow` - Type-safe wrapper (12 methods)"
          - "`DataSet` - Immutable collection (15 methods)"
          - "`DataQuery` - Fluent DSL builder (18 methods)"
          - "`DataOperations` - Complex ops (11 static methods)"
          - "**Total:** 56 custom methods to learn/maintain"

      - type: bullets
        title: "Strengths"
        items:
          - "✅ **Dual execution modes** - POJO when needed, Dynamic for flexibility"
          - "✅ **No POJOs required** (dynamic mode) - Less boilerplate"
          - "✅ **Type-safe accessors** - `row.getString()` vs `(String) row.get()`"
          - "✅ **Built-in operations** - Joins, unions, pivots, aggregations"
          - "✅ **Same footprint** - No additional dependencies vs POJO"

      - type: bullets
        title: "Considerations"
        items:
          - "⚠️ **Custom API maintenance** - 56 methods across 4 custom classes to maintain"
          - "⚠️ **Runtime type safety only** - Column name typos found at runtime"
          - "⚠️ **Learning curve** - Team needs to learn framework-specific API"
          - "⚠️ **Framework lock-in** - DataRow/DataSet/DataQuery are proprietary"
          - "⚠️ **Long-term support** - Custom API requires ongoing maintenance/documentation"

  # ============================================================
  # Slide 5: Option 3 - Spark SQL
  # ============================================================
  - slide_number: 5
    title: "Option 3 - Spark SQL (Spark-impl Branch)"
    sections:
      - type: subtitle
        content: "How It Works"

      - type: code
        language: java
        content: |
          // Setup Spark (local JVM only, no cluster)
          SparkConfig config = SparkConfig.builder()
              .master("local[*]")  // Local execution in Spring Boot JVM
              .build();

          // NO POJO, NO column mappings!
          SparkReportResult result = service.execute("employees", params);

          // Transform using Spark SQL (industry-standard API)
          Dataset<Row> employees = result.getDataset();

          Dataset<Row> summary = employees
              .filter("salary > 80000")
              .groupBy("department_id")
              .agg(
                  avg("salary").as("avg_salary"),
                  max("salary").as("max_salary"),
                  count("*").as("employee_count")
              )
              .orderBy(desc("avg_salary"));

          // JSON output for REST APIs
          String json = result.toJSON();

      - type: table
        title: "Key Metrics"
        headers: ["Metric", "Value"]
        rows:
          - ["Code per report", "5-8 lines"]
          - ["Runtime dependencies", "4 (Spark-SQL, Jackson, SLF4J, JDBC)"]
          - ["JAR size", "~25 MB (spark-sql only, local mode)"]
          - ["Memory overhead", "~400 MB (SparkSession in local mode)"]
          - ["Startup time", "~2-3 seconds (SparkSession init)"]
          - ["API learning curve", "⚠️ Medium (Spark SQL/DataFrame API)"]
          - ["Execution mode", "Local JVM (Spring Boot/Tomcat)"]

      - type: callout
        content: "**Important:** This uses **spark-sql library only** for SQL operations in local JVM, **NOT** distributed Spark cluster."

      - type: bullets
        title: "Strengths"
        items:
          - "✅ **Zero POJOs** - No class definitions needed"
          - "✅ **Auto-inferred schema** - No column mappings to maintain"
          - "✅ **Industry-standard API** - Spark SQL is widely known, not proprietary"
          - "✅ **Rich SQL operations** - Window functions, UDFs, complex analytics"
          - "✅ **JSON output** - Direct conversion for REST APIs"
          - "✅ **Query optimization** - Catalyst optimizer for complex queries"
          - "✅ **Widely supported** - Extensive documentation, Stack Overflow, tutorials"

      - type: bullets
        title: "Considerations"
        items:
          - "⚠️ **SparkSession overhead** - ~200 MB memory, 2-3s startup (one-time per app)"
          - "⚠️ **Additional JAR** - +17 MB vs POJO (but still local JVM only)"
          - "⚠️ **Runtime type safety** - Column references via strings"

  # ============================================================
  # Slide 6: Development Effort Comparison
  # ============================================================
  - slide_number: 6
    title: "Development Effort Comparison"
    sections:
      - type: subtitle
        content: "Code Required for Same Report"

      - type: text
        content: "**Scenario:** Employee report filtered by salary, grouped by department"

      - type: code_comparison
        approaches:
          - name: "POJO Approach"
            lines: "~55 lines"
            code: |
              // EmployeeReport.java (30 lines)
              public class EmployeeReport {
                  private Integer employeeId;
                  private String firstName;
                  private String lastName;
                  private BigDecimal salary;
                  private Integer departmentId;
                  // 20 lines of getters/setters
              }

              // Metadata (15 lines)
              "columnMappings": [
                  {"column": "employee_id", "field": "employeeId", "required": true},
                  {"column": "first_name", "field": "firstName", "required": true},
                  {"column": "last_name", "field": "lastName", "required": true},
                  {"column": "salary", "field": "salary", "required": true},
                  {"column": "department_id", "field": "departmentId", "required": true}
              ]

              // Execution + Transformation (10 lines)
              ReportResult<EmployeeReport> result = service.execute("employees", params);
              Map<Integer, List<EmployeeReport>> grouped = result.getResults().stream()
                  .filter(emp -> emp.getSalary().compareTo(valueOf(80000)) > 0)
                  .collect(Collectors.groupingBy(EmployeeReport::getDepartmentId));
              Map<Integer, Double> avgSalary = grouped.entrySet().stream()
                  .collect(Collectors.toMap(Map.Entry::getKey,
                      e -> e.getValue().stream().mapToDouble(emp -> emp.getSalary().doubleValue()).average().orElse(0)));

          - name: "Dataset-impl Approach"
            lines: "~12 lines"
            code: |
              // No POJO needed

              // Metadata (2 lines - minimal)
              "resultClass": "java.util.Map"

              // Execution + Transformation (10 lines)
              DataSet result = service.executeDynamic("employees", params);
              DataSet summary = DataQuery.from(result)
                  .filter(row -> row.getBigDecimal("salary").compareTo(valueOf(80000)) > 0)
                  .groupBy("department_id")
                      .avg("salary")
                      .count("*")
                  .execute();

          - name: "Spark-SQL Approach"
            lines: "~7 lines"
            code: |
              // No POJO, no mappings

              // Execution + Transformation (7 lines)
              SparkReportResult result = service.execute("employees", params);
              Dataset<Row> summary = result.getDataset()
                  .filter("salary > 80000")
                  .groupBy("department_id")
                  .agg(avg("salary"), count("*"));
              String json = summary.toJSON().collectAsList().toString();

      - type: text
        content: "**Code Reduction:** POJO (55 lines) → Dataset-impl (12 lines, **78% less**) → Spark-SQL (7 lines, **87% less**)"

  # ============================================================
  # Slide 7: Transformation Capabilities
  # ============================================================
  - slide_number: 7
    title: "Transformation Capabilities Comparison"
    sections:
      - type: table
        headers: ["Operation", "POJO (Java Streams)", "Dataset-impl (Custom DSL)", "Spark-SQL"]
        rows:
          - ["Filter", "✅ `stream().filter()`", "✅ `.filter(row -> ...)`", "✅ `.filter(\"col > val\")`"]
          - ["Map/Select", "✅ `stream().map()`", "✅ `.select(\"col1\", \"col2\")`", "✅ `.select(\"col1\", \"col2\")`"]
          - ["Sort", "✅ `sorted(Comparator)`", "✅ `.orderBy(\"col\").desc()`", "✅ `.orderBy(desc(\"col\"))`"]
          - ["Limit", "✅ `limit(n)`", "✅ `.limit(n)`", "✅ `.limit(n)`"]
          - ["GroupBy + Agg", "⚠️ Manual `groupingBy()` + custom reducers", "✅ `.groupBy().avg().count()`", "✅ `.groupBy().agg(avg(), count())`"]
          - ["Joins", "⚠️ Manual Map-based joins", "✅ `DataOperations.join()`", "✅ `.join(other, \"key\")`"]
          - ["Window Functions", "❌ Complex manual code", "❌ Not supported", "✅ Built-in `Window.partitionBy()`"]
          - ["Pivot", "❌ Very complex", "✅ `DataOperations.pivot()`", "✅ `.pivot(\"column\")`"]
          - ["Running Totals", "⚠️ Manual stateful logic", "✅ `DataOperations.withRunningTotal()`", "✅ Window functions"]

      - type: bullets
        title: "Summary"
        items:
          - "**POJO:** Native Java Streams excellent for simple operations, verbose for complex ones"
          - "**Dataset-impl:** Custom DSL covers common operations, requires framework maintenance"
          - "**Spark-SQL:** Industry-standard API, richest feature set, well-documented"

