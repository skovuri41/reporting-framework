          - ["Runtime errors", "✅ Low (compile-time)", "⚠️ Medium (string column names)", "⚠️ Medium (string column names)"]
          - ["API maintenance", "✅ None (Java stdlib)", "⚠️ High (56 custom methods)", "✅ None (Spark is maintained)"]
          - ["Team onboarding", "✅ Fast (<1 day)", "⚠️ Medium (2-3 days)", "⚠️ Medium (2-3 days with Spark training)"]
