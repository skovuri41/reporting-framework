  # ============================================================
  # Slide 9: Decision Matrix
  # ============================================================
  - slide_number: 9
    title: "Decision Matrix"
    sections:
      - type: table
        title: "Scenario-Based Recommendations"
        headers: ["Scenario", "Recommended", "Rationale"]
        rows:
          - ["Stable schema, small team", "✅ **POJO**", "Compile-time safety, zero learning curve, native Java Streams"]
