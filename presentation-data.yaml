  # ============================================================
  # Slide 10: Recommendation & Next Steps
  # ============================================================
  - slide_number: 10
    title: "Recommendation & Next Steps"
    sections:
      - type: table
        title: "Data-Driven Summary"
        headers: ["Metric", "POJO", "Dataset-impl", "Spark-SQL"]
        rows:
          - ["Code per report", "55 lines", "12 lines (-78%)", "7 lines (-87%)"]
          - ["JAR size", "3.6 MB", "3.8 MB", "20.7 MB"]
          - ["Memory", "512 MB", "512 MB", "768 MB"]
          - ["Startup", "<1s", "<1s", "2-3s"]
