      - type: bullets
        title: "Choose POJO if"
        items:
          - "Compile-time type safety is **critical**"
          - "Team wants native Java Streams (no new API)"
          - "Minimal dependencies/memory required"
          - "Willing to accept POJO maintenance overhead"

      - type: bullets
        title: "Choose Spark-SQL if"
        items:
          - "Development speed is priority (87% less code)"
          - "Schema changes frequently"
          - "Complex analytics needed (pivots, windows, UDFs)"
          - "17 MB dependency and 256 MB memory are acceptable"
          - "Team can learn Spark SQL (industry-standard, well-documented)"

      - type: bullets
        title: "Choose Dataset-impl if"
        items:
          - "Want both modes (POJO + Dynamic)"
          - "Willing to maintain custom API (56 methods)"
          - "Don't need distributed processing"
          - "Team committed to learning proprietary framework"

      - type: bullets
